appId: com.namanrathi.anything-download-manager
productName: Anything Download Manager
copyright: Copyright © 2024 Naman Rathi

directories:
  output: release
  buildResources: assets

npmRebuild: false
nodeGypRebuild: false
asar: true
asarUnpack:
  - "**/*.node"

files:
  - dist/**/*
  - assets/**/*
  - node_modules/**/*
  - "!node_modules/**/*.{md,map,ts}"
  - "!node_modules/*/{test,__tests__,tests,example,examples,docs}/**"

extraResources:
  - from: native-messaging-host/
    to: native-messaging-host/
    filter:
      - "**/*"
  - from: browser-extension/
    to: browser-extension/
    filter:
      - "**/*"
  - from: assets/
    to: assets/
    filter:
      - "*.png"
      - "*.ico"
      - "*.icns"

mac:
  category: public.app-category.utilities
  icon: assets/icon.icns
  artifactName: ADM-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ADM-${version}-mac-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Anything Download Manager
  artifactName: ADM-${version}-win-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: ADM-${version}-win-${arch}-portable.${ext}

linux:
  icon: assets/icon.png
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  desktop:
    Name: Anything Download Manager
    Comment: Open-source download manager with multi-segment acceleration by Naman Rathi
    Categories: Network;FileTransfer;
    StartupWMClass: anything-download-manager

appImage:
  artifactName: ADM-${version}-linux-${arch}.${ext}

deb:
  artifactName: ADM-${version}-linux-${arch}.${ext}
