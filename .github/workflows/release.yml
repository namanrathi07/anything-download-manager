name: Build and Release Anything Download Manager

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            npm_script: dist:win
          # macOS Universal (arm64 & x64)
          - os: macos-latest
            arch: universal
            npm_script: dist:mac
          # Linux x64
          - os: ubuntu-latest
            arch: x64
            npm_script: dist:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip

      - name: Install Node Dependencies
        run: npm install

      - name: Package Universal Browser Extension (Linux runner)
        if: runner.os == 'Linux'
        run: npm run package:extension

      - name: Compile and Package Application
        run: npm run ${{ matrix.npm_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adm-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/adm-browser-extension.zip
          retention-days: 30

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Anything Download Manager v1.0.0"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/adm-browser-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
